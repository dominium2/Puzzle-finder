services:
  frontend:
    build:
      context: ../puzzlefinder-frontend
      args:
        REACT_APP_API_BASE: http://localhost:8080/webhook
    ports:
      - "8080:80"
    networks:
      - puzzle-net
    depends_on:
      - n8n

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin@local.test
      - N8N_BASIC_AUTH_PASSWORD=admin
      - N8N_USER_MANAGEMENT_DISABLED=true
      - N8N_DEFAULT_BINARY_DATA_MODE=memory
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_CORS_ALLOWED_ORIGINS=*
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_CORS_ALLOWED_ORIGINS=http://localhost:8080   
    volumes:
      - ./Puzzle-finder/.n8n_data:/home/node/.n8n
      - ./Puzzle-finder/.images:/home/node/images
    networks:
      - puzzle-net
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=n8n_db
      - MYSQL_USER=n8n_user
      - MYSQL_PASSWORD=n8n_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Puzzle-finder/db-init.sql:/docker-entrypoint-initdb.d/01-db-init.sql:ro
    networks:
      - puzzle-net

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    deploy:
      resources:
        limits:
          memory: 6g
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - puzzle-net

volumes:
  mysql_data:
  ollama_data:

networks:
  puzzle-net:
    driver: bridge
