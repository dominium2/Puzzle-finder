services:
  web:
    build: .
    container_name: puzzle-finder-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - n8n-network
    depends_on:
      - n8n

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - .n8n_data:/home/node/.n8n
      - .images:/home/node/images
    networks:
      - n8n-network
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=n8n_db
      - MYSQL_USER=n8n_user
      - MYSQL_PASSWORD=n8n_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - n8n-network

volumes:
  mysql_data:
    driver: local

networks:
  n8n-network:
    driver: bridge
