<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle Finder - Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
            background: #343541;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: #202123;
            border-bottom: 1px solid #444654;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ececf1;
            font-size: 16px;
            font-weight: 600;
        }

        .header-title .icon {
            font-size: 24px;
        }

        .settings-btn {
            background: transparent;
            border: 1px solid #565869;
            color: #ececf1;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .settings-btn:hover {
            background: #40414f;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            display: flex;
            gap: 16px;
            padding: 20px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            background: transparent;
        }

        .message.assistant {
            background: #444654;
        }

        .message.system {
            background: #2d5f2e;
        }

        .message.error {
            background: #5f2d2d;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .avatar.user {
            background: #5436da;
        }

        .avatar.assistant {
            background: #19c37d;
        }

        .avatar.system {
            background: #2d5f2e;
        }

        .message-content {
            flex: 1;
            color: #ececf1;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .message-time {
            font-size: 12px;
            color: #8e8ea0;
            margin-top: 8px;
        }

        .input-area {
            background: #343541;
            padding: 20px;
            border-top: 1px solid #444654;
        }

        .input-container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }

        .input-wrapper {
            display: flex;
            align-items: flex-end;
            background: #40414f;
            border-radius: 12px;
            padding: 12px 16px;
            border: 1px solid transparent;
            transition: border-color 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: #565869;
        }

        #messageInput {
            flex: 1;
            background: transparent;
            border: none;
            color: #ececf1;
            font-size: 16px;
            font-family: inherit;
            resize: none;
            max-height: 200px;
            line-height: 1.5;
        }

        #messageInput:focus {
            outline: none;
        }

        #messageInput::placeholder {
            color: #8e8ea0;
        }

        .send-btn {
            background: transparent;
            border: none;
            color: #8e8ea0;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            margin-left: 8px;
        }

        .send-btn:hover:not(:disabled) {
            color: #ececf1;
        }

        .send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .send-btn svg {
            width: 20px;
            height: 20px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #343541;
            border-radius: 12px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
            color: #ececf1;
        }

        .modal-header {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ececf1;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            background: #40414f;
            border: 1px solid #565869;
            border-radius: 6px;
            padding: 10px 12px;
            color: #ececf1;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #8e8ea0;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
        }

        .modal-btn {
            padding: 10px 20px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .modal-btn.cancel {
            background: transparent;
            color: #ececf1;
            border: 1px solid #565869;
        }

        .modal-btn.cancel:hover {
            background: #40414f;
        }

        .modal-btn.save {
            background: #19c37d;
            color: white;
        }

        .modal-btn.save:hover {
            background: #17a869;
        }

        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #8e8ea0;
            text-align: center;
            padding: 40px 20px;
        }

        .empty-state .icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state h2 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #ececf1;
        }

        .empty-state p {
            font-size: 14px;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 8px 0;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #8e8ea0;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                opacity: 0.3;
                transform: translateY(0);
            }
            30% {
                opacity: 1;
                transform: translateY(-8px);
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-title">
            <span class="icon">🧩</span>
            <span>Puzzle Finder</span>
        </div>
        <button class="settings-btn" onclick="openSettings()">⚙️ Settings</button>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="empty-state">
            <div class="icon">💬</div>
            <h2>Ready to process links</h2>
            <p>Send any message or link, and it will be forwarded to N8N for processing</p>
        </div>
    </div>

    <div class="input-area">
        <div class="input-container">
            <div class="input-wrapper">
                <textarea 
                    id="messageInput" 
                    rows="1" 
                    placeholder="Send a message or link..."
                    onkeydown="handleKeyPress(event)"
                    oninput="adjustTextareaHeight(this)"></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                    <svg fill="currentColor" viewBox="0 0 20 20">
                        <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">Settings</div>
            <div class="form-group">
                <label for="webhookUrlInput">N8N Webhook URL</label>
                <input 
                    type="url" 
                    id="webhookUrlInput" 
                    placeholder="http://localhost:5678/webhook/your-webhook-id">
            </div>
            <div class="modal-actions">
                <button class="modal-btn cancel" onclick="closeSettings()">Cancel</button>
                <button class="modal-btn save" onclick="saveSettings()">Save</button>
            </div>
        </div>
    </div>

    <script>
        let messages = [];
        
        function loadSettings() {
            const savedUrl = localStorage.getItem('n8nWebhookUrl');
            if (savedUrl) {
                document.getElementById('webhookUrlInput').value = savedUrl;
            }
        }

        function openSettings() {
            document.getElementById('settingsModal').classList.add('active');
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.remove('active');
        }

        function saveSettings() {
            const webhookUrl = document.getElementById('webhookUrlInput').value.trim();
            
            let processedUrl = webhookUrl;
            if (webhookUrl.includes('localhost:5678')) {
                processedUrl = webhookUrl.replace('localhost:5678', 'n8n:5678');
                console.log('Converted webhook URL for Docker network:', processedUrl);
            }
            
            localStorage.setItem('n8nWebhookUrl', processedUrl);
            closeSettings();
            
            if (messages.length === 0) {
                addMessage('system', '✅ Webhook URL configured successfully!');
            }
        }

        function addMessage(type, content, showTime = true) {
            const chatContainer = document.getElementById('chatContainer');
            
            const emptyState = chatContainer.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const avatar = document.createElement('div');
            avatar.className = `avatar ${type}`;
            avatar.textContent = type === 'user' ? '👤' : type === 'assistant' ? '🤖' : 'ℹ️';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;
            
            if (showTime) {
                const timeDiv = document.createElement('div');
                timeDiv.className = 'message-time';
                timeDiv.textContent = new Date().toLocaleTimeString();
                contentDiv.appendChild(timeDiv);
            }
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentDiv);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            
            messages.push({ type, content, timestamp: new Date() });
        }

        function showTypingIndicator() {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';
            messageDiv.id = 'typingIndicator';
            
            const avatar = document.createElement('div');
            avatar.className = 'avatar assistant';
            avatar.textContent = '🤖';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';
            typingDiv.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
            contentDiv.appendChild(typingDiv);
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentDiv);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) {
                indicator.remove();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            const webhookUrl = localStorage.getItem('n8nWebhookUrl');
            
            if (!webhookUrl) {
                addMessage('error', '⚠️ Please configure the webhook URL in settings first.');
                openSettings();
                return;
            }
            
            addMessage('user', message);
            input.value = '';
            adjustTextareaHeight(input);
            showTypingIndicator();
            
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            
            try {
                const payload = {
                    message: message,
                    timestamp: new Date().toISOString(),
                    source: 'puzzle-finder-chat'
                };

                const response = await fetch('/api/webhook', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        webhookUrl: webhookUrl,
                        data: payload
                    })
                });

                removeTypingIndicator();

                if (response.ok) {
                    const data = await response.json();
                    addMessage('assistant', '✅ Message processed successfully by N8N!');
                } else {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }
            } catch (error) {
                removeTypingIndicator();
                console.error('Error:', error);
                addMessage('error', `❌ Error: ${error.message}`);
            } finally {
                sendBtn.disabled = false;
                input.focus();
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function adjustTextareaHeight(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 200) + 'px';
        }

        loadSettings();
        
        if (!localStorage.getItem('n8nWebhookUrl')) {
            setTimeout(() => {
                addMessage('system', '👋 Welcome! Please configure your N8N webhook URL to get started.');
                openSettings();
            }, 500);
        }
    </script>
</body>
</html>
